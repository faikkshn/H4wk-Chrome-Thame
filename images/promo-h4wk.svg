<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050f;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f001e;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="nebula1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#6600ff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#aa00ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="nebula2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#00ffaa;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ccff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1280" height="800" fill="url(#deepSpace)"/>

  <!-- Nebula effects -->
  <ellipse cx="384" cy="320" rx="500" ry="400" fill="url(#nebula1)" filter="url(#blur)"/>
  <ellipse cx="896" cy="480" rx="600" ry="450" fill="url(#nebula2)" filter="url(#blur)"/>

  <!-- Star field -->
  <g opacity="0.8">
    <!-- Animated large stars -->
    <circle cx="100" cy="80" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="150" r="1.5" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="200" r="2" fill="#00ffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="100" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="250" r="2" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="120" r="1.5" fill="#00ffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="180" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="90" r="1.5" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>

    <!-- Static medium stars -->
    <circle cx="150" cy="400" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="350" cy="450" r="1.2" fill="#00ffaa" opacity="0.6"/>
    <circle cx="550" cy="500" r="1.5" fill="#00ffff" opacity="0.7"/>
    <circle cx="750" cy="420" r="1.2" fill="#ffffff" opacity="0.6"/>
    <circle cx="950" cy="480" r="1.5" fill="#00ffaa" opacity="0.7"/>
    <circle cx="1150" cy="460" r="1.2" fill="#00ffff" opacity="0.6"/>

    <!-- Small stars -->
    <circle cx="80" cy="600" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="220" cy="650" r="1" fill="#00ffaa" opacity="0.4"/>
    <circle cx="380" cy="700" r="1" fill="#00ffff" opacity="0.5"/>
    <circle cx="520" cy="720" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="680" cy="680" r="1" fill="#00ffaa" opacity="0.5"/>
    <circle cx="840" cy="720" r="1" fill="#00ffff" opacity="0.4"/>
    <circle cx="1000" cy="650" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1150" cy="700" r="1" fill="#00ffaa" opacity="0.4"/>
  </g>

  <!-- Matrix code rain effect (very subtle) -->
  <g opacity="0.1" fill="#00ff00" font-family="monospace" font-size="14">
    <text x="50" y="100">01001000</text>
    <text x="50" y="120">01000001</text>
    <text x="50" y="140">01010111</text>
    <text x="50" y="160">01001011</text>

    <text x="1150" y="200">EXECUTE</text>
    <text x="1150" y="220">COMPILE</text>
    <text x="1150" y="240">DEBUG</text>

    <text x="900" y="700">0xH4WK</text>
  </g>

  <!-- Logo placeholder circle (left side) -->
  <g transform="translate(300, 400)">
    <circle cx="0" cy="0" r="145" fill="rgba(10, 10, 25, 0.6)"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#neonCyan)" stroke-width="4" filter="url(#glow)"/>

    <!-- Placeholder - Replace with logo.png -->
    <text x="0" y="-40"
          font-family="'Courier New', monospace"
          font-size="36"
          font-weight="bold"
          fill="url(#neonGreen)"
          text-anchor="middle"
          filter="url(#glow)">LOGO</text>
    <text x="0" y="10"
          font-family="'Courier New', monospace"
          font-size="20"
          fill="#00ffaa"
          text-anchor="middle"
          opacity="0.7">Place</text>
    <text x="0" y="35"
          font-family="'Courier New', monospace"
          font-size="20"
          fill="#00ffaa"
          text-anchor="middle"
          opacity="0.7">logo.png</text>
    <text x="0" y="60"
          font-family="'Courier New', monospace"
          font-size="20"
          fill="#00ffaa"
          text-anchor="middle"
          opacity="0.7">here</text>
  </g>

  <!-- Main content (right side) -->
  <g transform="translate(550, 0)">
    <!-- H4WK title -->
    <text x="0" y="280"
          font-family="'Courier New', monospace"
          font-size="120"
          font-weight="bold"
          fill="url(#neonGreen)"
          filter="url(#glow)"
          letter-spacing="8">H4WK</text>

    <!-- Subtitle -->
    <text x="0" y="340"
          font-family="'Courier New', monospace"
          font-size="32"
          fill="#00ffaa"
          letter-spacing="4"
          opacity="0.9">SPACE HACKER THEME</text>

    <!-- Description -->
    <text x="0" y="390"
          font-family="'Courier New', monospace"
          font-size="20"
          fill="#00ffff"
          letter-spacing="1"
          opacity="0.8">Chrome Browser Edition</text>

    <!-- Feature list -->
    <g transform="translate(0, 440)" font-family="'Courier New', monospace" font-size="18" fill="#00ffaa" opacity="0.9">
      <text x="0" y="0">▸ Cyberpunk Neon Aesthetics</text>
      <text x="0" y="35">▸ Space Age Design</text>
      <text x="0" y="70">▸ Hacker Culture Elements</text>
      <text x="0" y="105">▸ Professional Dark Theme</text>
    </g>

    <!-- Version badge -->
    <g transform="translate(0, 600)">
      <rect x="0" y="-25" width="200" height="40" rx="20" fill="rgba(0, 255, 170, 0.2)" stroke="#00ffaa" stroke-width="2"/>
      <text x="100" y="0"
            font-family="'Courier New', monospace"
            font-size="18"
            font-weight="bold"
            fill="#00ffaa"
            text-anchor="middle">VERSION 1.0.0</text>
    </g>
  </g>

  <!-- Bottom line -->
  <g opacity="0.6">
    <line x1="100" y1="750" x2="1180" y2="750" stroke="url(#neonGreen)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="100" cy="750" r="5" fill="#00ffaa" filter="url(#glow)"/>
    <circle cx="1180" cy="750" r="5" fill="#00ffaa" filter="url(#glow)"/>
  </g>

  <!-- Bottom text -->
  <text x="640" y="780"
        font-family="'Courier New', monospace"
        font-size="16"
        fill="#00ffaa"
        text-anchor="middle"
        opacity="0.7">🌌 POWERED BY H4WK • PROFESSIONAL CHROME THEME FOR DEVELOPERS</text>

  <!-- HUD Corner brackets -->
  <g stroke="#00ffaa" stroke-width="3" fill="none" opacity="0.5">
    <path d="M 20 60 L 20 20 L 60 20"/>
    <path d="M 1220 20 L 1260 20 L 1260 60"/>
    <path d="M 20 740 L 20 780 L 60 780"/>
    <path d="M 1260 740 L 1260 780 L 1220 780"/>
  </g>

  <!-- Corner nodes -->
  <g fill="#00ffff" opacity="0.7">
    <circle cx="20" cy="20" r="4" filter="url(#glow)"/>
    <circle cx="1260" cy="20" r="4" filter="url(#glow)"/>
    <circle cx="20" cy="780" r="4" filter="url(#glow)"/>
    <circle cx="1260" cy="780" r="4" filter="url(#glow)"/>
  </g>

  <!-- Scanning line animation -->
  <line x1="0" y1="400" x2="1280" y2="400" stroke="#00ffaa" stroke-width="2" opacity="0.3">
    <animate attributeName="y1" values="0;800;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;800;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="8s" repeatCount="indefinite"/>
  </line>
</svg>
