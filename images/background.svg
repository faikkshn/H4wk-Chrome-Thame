<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a28;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="nebula1" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#6600ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0000ff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="nebula2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#00ffaa;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0" />
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1920" height="1080" fill="url(#deepSpace)"/>

  <!-- Nebula effects -->
  <ellipse cx="576" cy="324" rx="400" ry="300" fill="url(#nebula1)" filter="url(#blur)"/>
  <ellipse cx="1344" cy="648" rx="500" ry="350" fill="url(#nebula2)" filter="url(#blur)"/>

  <!-- Stars field -->
  <g opacity="0.8">
    <circle cx="150" cy="80" r="1.5" fill="#ffffff"/>
    <circle cx="300" cy="150" r="1" fill="#00ffaa"/>
    <circle cx="450" cy="200" r="1.2" fill="#ffffff"/>
    <circle cx="600" cy="100" r="0.8" fill="#00ffff"/>
    <circle cx="750" cy="250" r="1.5" fill="#ffffff"/>
    <circle cx="900" cy="120" r="1" fill="#00ffaa"/>
    <circle cx="1050" cy="180" r="1.3" fill="#ffffff"/>
    <circle cx="1200" cy="90" r="1" fill="#00ffff"/>
    <circle cx="1350" cy="220" r="1.5" fill="#ffffff"/>
    <circle cx="1500" cy="140" r="0.9" fill="#00ffaa"/>
    <circle cx="1650" cy="190" r="1.2" fill="#ffffff"/>
    <circle cx="1800" cy="110" r="1" fill="#00ffff"/>

    <circle cx="200" cy="400" r="1" fill="#ffffff"/>
    <circle cx="400" cy="450" r="1.5" fill="#00ffaa"/>
    <circle cx="600" cy="500" r="1.2" fill="#ffffff"/>
    <circle cx="800" cy="420" r="1" fill="#00ffff"/>
    <circle cx="1000" cy="480" r="1.3" fill="#ffffff"/>
    <circle cx="1200" cy="460" r="1" fill="#00ffaa"/>
    <circle cx="1400" cy="510" r="1.5" fill="#ffffff"/>
    <circle cx="1600" cy="430" r="1" fill="#00ffff"/>
    <circle cx="1800" cy="490" r="1.2" fill="#ffffff"/>

    <circle cx="100" cy="700" r="1.5" fill="#ffffff"/>
    <circle cx="300" cy="750" r="1" fill="#00ffaa"/>
    <circle cx="500" cy="800" r="1.2" fill="#ffffff"/>
    <circle cx="700" cy="720" r="1" fill="#00ffff"/>
    <circle cx="900" cy="780" r="1.5" fill="#ffffff"/>
    <circle cx="1100" cy="740" r="1" fill="#00ffaa"/>
    <circle cx="1300" cy="790" r="1.3" fill="#ffffff"/>
    <circle cx="1500" cy="710" r="1" fill="#00ffff"/>
    <circle cx="1700" cy="770" r="1.5" fill="#ffffff"/>

    <circle cx="250" cy="920" r="1" fill="#ffffff"/>
    <circle cx="450" cy="970" r="1.2" fill="#00ffaa"/>
    <circle cx="650" cy="940" r="1" fill="#ffffff"/>
    <circle cx="850" cy="990" r="1.5" fill="#00ffff"/>
    <circle cx="1050" cy="950" r="1" fill="#ffffff"/>
    <circle cx="1250" cy="1000" r="1.3" fill="#00ffaa"/>
    <circle cx="1450" cy="930" r="1" fill="#ffffff"/>
    <circle cx="1650" cy="980" r="1.5" fill="#00ffff"/>
  </g>

  <!-- Matrix-style code rain effect (stylized) -->
  <g opacity="0.15" font-family="monospace" font-size="12" fill="#00ff00">
    <text x="100" y="50">01001000</text>
    <text x="100" y="70">01000001</text>
    <text x="100" y="90">01010111</text>
    <text x="100" y="110">01001011</text>

    <text x="500" y="200">EXECUTE</text>
    <text x="500" y="220">COMPILE</text>
    <text x="500" y="240">DEBUG</text>

    <text x="1400" y="300">&lt;/HAWK&gt;</text>
    <text x="1400" y="320">INIT...</text>
    <text x="1400" y="340">SUCCESS</text>

    <text x="800" y="850">0xH4WK</text>
    <text x="800" y="870">0xSAHIN</text>
  </g>

  <!-- Circuit pattern overlay -->
  <g opacity="0.1" stroke="#00ffaa" stroke-width="1" fill="none">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <circle cx="480" cy="540" r="50"/>
    <circle cx="960" cy="540" r="50"/>
    <circle cx="1440" cy="540" r="50"/>
    <rect x="400" y="500" width="160" height="80"/>
    <rect x="880" y="500" width="160" height="80"/>
    <rect x="1360" y="500" width="160" height="80"/>
  </g>

  <!-- Large H4WK signature in center -->
  <g filter="url(#glow)">
    <text x="960" y="540" font-family="monospace, 'Courier New'" font-size="120"
          font-weight="bold" fill="#00ffaa" opacity="0.15" text-anchor="middle">H4WK</text>
    <text x="960" y="600" font-family="monospace, 'Courier New'" font-size="40"
          font-weight="bold" fill="#00ffff" opacity="0.1" text-anchor="middle">ŞAHİN</text>
  </g>

  <!-- Scan line effect -->
  <rect x="0" y="0" width="1920" height="1" fill="#00ffaa" opacity="0.3">
    <animate attributeName="y" from="0" to="1080" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner UI elements (HUD style) -->
  <g stroke="#00ffaa" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 50 50 L 150 50 L 150 60 M 50 50 L 50 150"/>
    <path d="M 1870 50 L 1770 50 L 1770 60 M 1870 50 L 1870 150"/>
    <path d="M 50 1030 L 150 1030 L 150 1020 M 50 1030 L 50 930"/>
    <path d="M 1870 1030 L 1770 1030 L 1770 1020 M 1870 1030 L 1870 930"/>
  </g>

  <!-- Bottom status bar -->
  <g font-family="monospace" font-size="11" fill="#00ffaa" opacity="0.5">
    <text x="60" y="1050">[ SYSTEM: ACTIVE ]</text>
    <text x="960" y="1050" text-anchor="middle">[ H4WK THEME v1.0 - SPACE HACKER EDITION ]</text>
    <text x="1860" y="1050" text-anchor="end">[ ŞAHIN ]</text>
  </g>
</svg>
