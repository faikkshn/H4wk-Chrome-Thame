<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deepSpaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a28;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="nebula" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#6600ff;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#aa00ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ccff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="440" height="280" fill="url(#deepSpaceBg)"/>

  <!-- Nebula effect -->
  <ellipse cx="100" cy="80" rx="150" ry="100" fill="url(#nebula)" filter="url(#blur)"/>
  <ellipse cx="340" cy="200" rx="120" ry="80" fill="#00ffaa" opacity="0.1" filter="url(#blur)"/>

  <!-- Stars -->
  <g opacity="0.8">
    <circle cx="60" cy="40" r="1.5" fill="#ffffff"/>
    <circle cx="120" cy="70" r="1" fill="#00ffaa"/>
    <circle cx="180" cy="50" r="1.2" fill="#00ffff"/>
    <circle cx="300" cy="60" r="1" fill="#ffffff"/>
    <circle cx="360" cy="90" r="1.5" fill="#00ffaa"/>
    <circle cx="80" cy="180" r="1.2" fill="#00ffff"/>
    <circle cx="400" cy="240" r="1" fill="#ffffff"/>
    <circle cx="50" cy="220" r="1.5" fill="#00ffaa"/>
    <circle cx="380" cy="150" r="1.2" fill="#00ffff"/>
  </g>

  <!-- Logo placeholder circle (left side) -->
  <g transform="translate(110, 140)">
    <!-- Circle border for logo -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="85" fill="rgba(10, 10, 25, 0.3)"/>

    <!-- Placeholder text - user will replace with actual logo.png -->
    <text x="0" y="-30"
          font-family="'Courier New', monospace"
          font-size="28"
          font-weight="bold"
          fill="url(#neonGreen)"
          text-anchor="middle"
          filter="url(#glow)">LOGO</text>
    <text x="0" y="0"
          font-family="'Courier New', monospace"
          font-size="16"
          fill="#00ffaa"
          text-anchor="middle"
          opacity="0.7">Insert</text>
    <text x="0" y="20"
          font-family="'Courier New', monospace"
          font-size="16"
          fill="#00ffaa"
          text-anchor="middle"
          opacity="0.7">logo.png</text>
    <text x="0" y="40"
          font-family="'Courier New', monospace"
          font-size="16"
          fill="#00ffaa"
          text-anchor="middle"
          opacity="0.7">here</text>
  </g>

  <!-- Text Section (right side) -->
  <g transform="translate(220, 0)" filter="url(#glow)">
    <!-- H4WK -->
    <text x="0" y="100"
          font-family="'Courier New', monospace"
          font-size="64"
          font-weight="bold"
          fill="url(#neonGreen)"
          letter-spacing="4">H4WK</text>

    <!-- Subtitle -->
    <text x="0" y="145"
          font-family="'Courier New', monospace"
          font-size="18"
          fill="#00ffaa"
          letter-spacing="2"
          opacity="0.9">SPACE HACKER</text>

    <!-- Version -->
    <text x="0" y="175"
          font-family="'Courier New', monospace"
          font-size="14"
          fill="#00ffff"
          letter-spacing="1"
          opacity="0.8">Chrome Theme v1.0</text>
  </g>

  <!-- Bottom decorative elements -->
  <g opacity="0.6">
    <!-- Left line -->
    <line x1="40" y1="240" x2="160" y2="240" stroke="url(#neonGreen)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="40" cy="240" r="3" fill="#00ffaa" filter="url(#glow)"/>
    <circle cx="160" cy="240" r="3" fill="#00ffaa" filter="url(#glow)"/>

    <!-- Right line -->
    <line x1="280" y1="240" x2="400" y2="240" stroke="url(#neonGreen)" stroke-width="2" filter="url(#glow)"/>
    <circle cx="280" cy="240" r="3" fill="#00ffaa" filter="url(#glow)"/>
    <circle cx="400" cy="240" r="3" fill="#00ffaa" filter="url(#glow)"/>
  </g>

  <!-- Bottom text -->
  <text x="220" y="265"
        font-family="'Courier New', monospace"
        font-size="10"
        fill="#00ffaa"
        text-anchor="middle"
        opacity="0.5">🌌 POWERED BY H4WK</text>

  <!-- HUD Corners -->
  <g stroke="#00ffaa" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 10 30 L 10 10 L 30 10"/>
    <path d="M 410 10 L 430 10 L 430 30"/>
    <path d="M 10 250 L 10 270 L 30 270"/>
    <path d="M 430 250 L 430 270 L 410 270"/>
  </g>
</svg>
