<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05050f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a28;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="nebula1" cx="30%" cy="40%">
      <stop offset="0%" style="stop-color:#6600ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0000ff;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="nebula2" cx="70%" cy="60%">
      <stop offset="0%" style="stop-color:#00ffaa;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0" />
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="1920" height="1080" fill="url(#deepSpace)"/>

  <!-- Nebula effects -->
  <ellipse cx="576" cy="432" rx="500" ry="400" fill="url(#nebula1)" filter="url(#blur)"/>
  <ellipse cx="1344" cy="648" rx="600" ry="450" fill="url(#nebula2)" filter="url(#blur)"/>

  <!-- Stars field - animated -->
  <g opacity="0.9">
    <!-- Large stars with twinkle -->
    <circle cx="150" cy="80" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="150" r="1.5" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="200" r="2" fill="#00ffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="100" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="250" r="2" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="120" r="1.5" fill="#00ffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="180" r="2" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1200" cy="90" r="1.5" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1350" cy="220" r="2" fill="#00ffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="140" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1650" cy="190" r="2" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1800" cy="110" r="1.5" fill="#00ffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite"/></circle>

    <!-- Medium stars -->
    <circle cx="200" cy="400" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="400" cy="450" r="1.2" fill="#00ffaa" opacity="0.6"/>
    <circle cx="600" cy="500" r="1.5" fill="#00ffff" opacity="0.7"/>
    <circle cx="800" cy="420" r="1.2" fill="#ffffff" opacity="0.6"/>
    <circle cx="1000" cy="480" r="1.5" fill="#00ffaa" opacity="0.7"/>
    <circle cx="1200" cy="460" r="1.2" fill="#00ffff" opacity="0.6"/>
    <circle cx="1400" cy="510" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="1600" cy="430" r="1.2" fill="#00ffaa" opacity="0.6"/>
    <circle cx="1800" cy="490" r="1.5" fill="#00ffff" opacity="0.7"/>

    <!-- Small stars -->
    <circle cx="100" cy="700" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="300" cy="750" r="1" fill="#00ffaa" opacity="0.4"/>
    <circle cx="500" cy="800" r="1" fill="#00ffff" opacity="0.5"/>
    <circle cx="700" cy="720" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="900" cy="780" r="1" fill="#00ffaa" opacity="0.5"/>
    <circle cx="1100" cy="740" r="1" fill="#00ffff" opacity="0.4"/>
    <circle cx="1300" cy="790" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="1500" cy="710" r="1" fill="#00ffaa" opacity="0.4"/>
    <circle cx="1700" cy="770" r="1" fill="#00ffff" opacity="0.5"/>
    <circle cx="1900" cy="730" r="1" fill="#ffffff" opacity="0.4"/>

    <circle cx="250" cy="920" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="450" cy="970" r="1" fill="#00ffaa" opacity="0.5"/>
    <circle cx="650" cy="940" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="850" cy="990" r="1" fill="#00ffff" opacity="0.5"/>
    <circle cx="1050" cy="950" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="1250" cy="1000" r="1" fill="#00ffaa" opacity="0.5"/>
    <circle cx="1450" cy="930" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="1650" cy="980" r="1" fill="#00ffff" opacity="0.5"/>
  </g>

  <!-- Matrix-style code rain (very subtle) -->
  <g opacity="0.08" font-family="monospace" font-size="14" fill="#00ff00">
    <text x="100" y="50">01001000</text>
    <text x="100" y="70">01000001</text>
    <text x="100" y="90">01010111</text>
    <text x="100" y="110">01001011</text>

    <text x="1700" y="200">EXECUTE</text>
    <text x="1700" y="220">COMPILE</text>
    <text x="1700" y="240">DEBUG</text>

    <text x="800" y="950">0xH4WK</text>
  </g>

  <!-- Circuit pattern overlay (very subtle) -->
  <g opacity="0.05" stroke="#00ffaa" stroke-width="1" fill="none">
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <circle cx="480" cy="540" r="50"/>
    <circle cx="960" cy="540" r="50"/>
    <circle cx="1440" cy="540" r="50"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
  </g>

  <!-- H4WK Logo watermark in center (using embedded logo.png) -->
  <g transform="translate(960, 540)" opacity="0.15" filter="url(#glow)">
    <!-- Placeholder for logo - will use actual logo.png as background in browser -->
    <!-- This is a fallback SVG representation -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#neonGreen)" stroke-width="3"/>

    <!-- H4WK Text -->
    <text x="0" y="-240"
          font-family="'Courier New', monospace"
          font-size="60"
          font-weight="bold"
          fill="url(#neonGreen)"
          text-anchor="middle"
          letter-spacing="10">H4WK</text>

    <!-- Signature line -->
    <text x="0" y="250"
          font-family="'Courier New', monospace"
          font-size="28"
          fill="#00ffff"
          text-anchor="middle"
          letter-spacing="4"
          opacity="0.8">SPACE HACKER THEME</text>
  </g>

  <!-- Bottom status bar -->
  <g font-family="monospace" font-size="14" fill="#00ffaa" opacity="0.6">
    <text x="60" y="1050">[ SYSTEM: ACTIVE ]</text>
    <text x="960" y="1050" text-anchor="middle">[ H4WK THEME v1.0 - CHROME EDITION ]</text>
    <text x="1860" y="1050" text-anchor="end">[ POWERED BY H4WK ]</text>
  </g>

  <!-- HUD Corner brackets -->
  <g stroke="#00ffaa" stroke-width="3" fill="none" opacity="0.5">
    <path d="M 20 60 L 20 20 L 60 20"/>
    <path d="M 1860 20 L 1900 20 L 1900 60"/>
    <path d="M 20 1020 L 20 1060 L 60 1060"/>
    <path d="M 1900 1020 L 1900 1060 L 1860 1060"/>
  </g>

  <!-- Corner nodes -->
  <g fill="#00ffff" opacity="0.6">
    <circle cx="20" cy="20" r="4" filter="url(#glow)"/>
    <circle cx="1900" cy="20" r="4" filter="url(#glow)"/>
    <circle cx="20" cy="1060" r="4" filter="url(#glow)"/>
    <circle cx="1900" cy="1060" r="4" filter="url(#glow)"/>
  </g>

  <!-- Scanning line animation -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#00ffaa" stroke-width="2" opacity="0.3">
    <animate attributeName="y1" values="0;1080;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;1080;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="8s" repeatCount="indefinite"/>
  </line>
</svg>
