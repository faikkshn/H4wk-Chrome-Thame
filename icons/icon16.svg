<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a35;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <filter id="f">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="8" cy="8" r="7.5" fill="url(#b)"/>
  <circle cx="8" cy="8" r="7" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.8"/>

  <!-- HAWK (simplified but recognizable) -->
  <g transform="translate(8, 8)" filter="url(#f)">

    <!-- Head -->
    <ellipse cx="0" cy="-4.5" rx="1.5" ry="1.8" fill="url(#hG)" opacity="0.95"/>

    <!-- Beak -->
    <path d="M -0.3 -4 L -1 -3.5 L -0.5 -3.8 Z" fill="#00ffff" opacity="0.95"/>

    <!-- Eye -->
    <circle cx="-0.5" cy="-4.5" r="0.6" fill="#00ffff" opacity="1"/>
    <circle cx="-0.5" cy="-4.5" r="0.3" fill="#0a0a19"/>

    <!-- Neck + Body (combined) -->
    <ellipse cx="0" cy="-1.5" rx="1.2" ry="1.5" fill="url(#hG)" opacity="0.9"/>
    <ellipse cx="0" cy="1" rx="2.5" ry="3.5" fill="url(#hG)" opacity="0.95"/>

    <!-- Circuit line -->
    <line x1="0" y1="-2" x2="0" y2="4" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>

    <!-- Left Wing -->
    <ellipse cx="-2.8" cy="0.5" rx="2.5" ry="1.8" fill="url(#hC)" opacity="0.85"
             transform="rotate(-25 -2.8 0.5)"/>
    <line x1="-1.5" y1="0.5" x2="-4" y2="1" stroke="#00ffff" stroke-width="0.4" opacity="0.4"/>

    <!-- Right Wing -->
    <ellipse cx="2.8" cy="0.5" rx="2.5" ry="1.8" fill="url(#hC)" opacity="0.85"
             transform="rotate(25 2.8 0.5)"/>
    <line x1="1.5" y1="0.5" x2="4" y2="1" stroke="#00ffff" stroke-width="0.4" opacity="0.4"/>

    <!-- Tail -->
    <path d="M -1 4 L -0.5 5.5 L 0 6 L 0.5 5.5 L 1 4 Z"
          fill="url(#hC)" opacity="0.9"/>
    <line x1="0" y1="4" x2="0" y2="5.5" stroke="#00ffff" stroke-width="0.4" opacity="0.5"/>

    <!-- Legs (very simple) -->
    <line x1="-0.8" y1="3.5" x2="-1" y2="5" stroke="#00ffaa" stroke-width="0.5" opacity="0.8"/>
    <line x1="0.8" y1="3.5" x2="1" y2="5" stroke="#00ffaa" stroke-width="0.5" opacity="0.8"/>
  </g>

  <!-- Corners -->
  <g stroke="#00ffaa" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M 1 3 L 1 1 L 3 1"/>
    <path d="M 13 1 L 15 1 L 15 3"/>
    <path d="M 1 13 L 1 15 L 3 15"/>
    <path d="M 15 13 L 15 15 L 13 15"/>
  </g>
</svg>
