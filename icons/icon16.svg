<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a35;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cyn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <filter id="g">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="8" cy="8" r="7.5" fill="url(#bg)"/>
  <circle cx="8" cy="8" r="7" fill="none" stroke="#00ffaa" stroke-width="1" opacity="0.8"/>

  <!-- Simplified HAWK -->
  <g filter="url(#g)">
    <!-- Head & Body combined -->
    <ellipse cx="8" cy="6" rx="2.5" ry="2" fill="url(#grn)" opacity="0.9"/>
    <ellipse cx="8" cy="10" rx="2.8" ry="4" fill="url(#grn)" opacity="0.9"/>

    <!-- Eye (bright point) -->
    <circle cx="7.2" cy="5.8" r="0.8" fill="#00ffff" opacity="1"/>
    <circle cx="7.2" cy="5.8" r="0.3" fill="#0a0a19"/>

    <!-- Beak -->
    <path d="M 8 4.5 L 7 4 L 7.5 5 Z" fill="#00ffff" opacity="0.9"/>

    <!-- Wings (simplified) -->
    <ellipse cx="5" cy="9" rx="2.5" ry="1.5" fill="url(#cyn)" opacity="0.8"/>
    <ellipse cx="11" cy="9" rx="2.5" ry="1.5" fill="url(#cyn)" opacity="0.8"/>

    <!-- Tail -->
    <path d="M 8 13 L 7 15 L 8 15.5 L 9 15 Z" fill="url(#cyn)" opacity="0.8"/>

    <!-- Central circuit line -->
    <line x1="8" y1="6" x2="8" y2="13" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Corner indicators -->
  <g stroke="#00ffaa" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M 1 3 L 1 1 L 3 1"/>
    <path d="M 13 1 L 15 1 L 15 3"/>
    <path d="M 1 13 L 1 15 L 3 15"/>
    <path d="M 15 13 L 15 15 L 13 15"/>
  </g>
</svg>
