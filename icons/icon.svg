<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f001e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#spaceGradient)" stroke="url(#neonCyan)" stroke-width="2"/>

  <!-- Stars in background -->
  <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="108" cy="25" r="1.5" fill="#00ffaa" opacity="0.6"/>
  <circle cx="95" cy="95" r="1" fill="#00ffff" opacity="0.7"/>
  <circle cx="30" cy="100" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="110" cy="60" r="0.8" fill="#00ff00" opacity="0.6"/>

  <!-- Hawk silhouette with tech elements -->
  <g filter="url(#glow)">
    <!-- Hawk head -->
    <path d="M 64 30 Q 50 35 45 45 Q 43 50 45 55 L 50 52 Q 55 48 64 48 Q 73 48 78 52 L 83 55 Q 85 50 83 45 Q 78 35 64 30 Z"
          fill="url(#neonGreen)" opacity="0.9"/>

    <!-- Hawk eye (digital) -->
    <circle cx="57" cy="42" r="3" fill="#00ffff" opacity="0.9"/>
    <circle cx="57" cy="42" r="1.5" fill="#0a0a19"/>

    <!-- Hawk wings (geometric, circuit-like) -->
    <path d="M 40 55 L 30 50 L 25 55 L 20 50 L 15 60 L 20 65 L 30 70 L 40 65 Z"
          fill="url(#neonCyan)" opacity="0.8" stroke="#00ffaa" stroke-width="1"/>
    <path d="M 88 55 L 98 50 L 103 55 L 108 50 L 113 60 L 108 65 L 98 70 L 88 65 Z"
          fill="url(#neonCyan)" opacity="0.8" stroke="#00ffaa" stroke-width="1"/>

    <!-- Body with circuit pattern -->
    <path d="M 52 55 L 50 70 L 55 85 L 64 90 L 73 85 L 78 70 L 76 55 Z"
          fill="url(#neonGreen)" opacity="0.85"/>

    <!-- Circuit lines on body -->
    <line x1="64" y1="55" x2="64" y2="85" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="55" y1="65" x2="73" y2="65" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="57" y1="75" x2="71" y2="75" stroke="#00ffff" stroke-width="1" opacity="0.6"/>

    <!-- Tail feathers (digital) -->
    <path d="M 64 90 L 60 105 L 64 110 L 68 105 Z" fill="url(#neonCyan)" opacity="0.8"/>
  </g>

  <!-- H4WK Text -->
  <text x="64" y="120" font-family="monospace, 'Courier New'" font-size="14" font-weight="bold"
        fill="url(#neonGreen)" text-anchor="middle" filter="url(#glow)">H4WK</text>

  <!-- Digital corners -->
  <path d="M 10 10 L 25 10 L 25 12 L 12 12 L 12 25 L 10 25 Z" fill="#00ffaa" opacity="0.7"/>
  <path d="M 118 10 L 103 10 L 103 12 L 116 12 L 116 25 L 118 25 Z" fill="#00ffaa" opacity="0.7"/>
  <path d="M 10 118 L 25 118 L 25 116 L 12 116 L 12 103 L 10 103 Z" fill="#00ffaa" opacity="0.7"/>
  <path d="M 118 118 L 103 118 L 103 116 L 116 116 L 116 103 L 118 103 Z" fill="#00ffaa" opacity="0.7"/>
</svg>
