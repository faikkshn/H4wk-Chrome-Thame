<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f001e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hawkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hawkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#00ccff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:0.4" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#spaceGrad)" opacity="0.95"/>
  <circle cx="64" cy="64" r="61" fill="none" stroke="url(#hawkCyan)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Stars -->
  <g opacity="0.8">
    <circle cx="20" cy="20" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="108" cy="25" r="1.5" fill="#00ffaa"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="100" r="1" fill="#00ffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="25" cy="105" r="1.2" fill="#ffffff" opacity="0.7"/>
    <circle cx="110" cy="70" r="0.9" fill="#00ffaa" opacity="0.6"/>
  </g>

  <!-- HAWK - Realistic Hawk Silhouette -->
  <g transform="translate(64, 64)" filter="url(#glow)">

    <!-- HAWK HEAD (top) - Sharp and angular like a real hawk -->
    <g>
      <!-- Head shape - rounded but sharp -->
      <ellipse cx="0" cy="-35" rx="12" ry="14" fill="url(#hawkGreen)" opacity="0.95"/>

      <!-- Beak - Sharp curved hawk beak -->
      <path d="M -2 -32 Q -8 -30 -10 -28 Q -9 -30 -6 -32 Q -4 -33 -2 -32 Z"
            fill="#00ffff" opacity="0.95" stroke="#00ccff" stroke-width="0.5"/>

      <!-- Eye - Intense hawk eye with glow -->
      <circle cx="-4" cy="-35" r="3.5" fill="url(#eyeGlow)" filter="url(#strongGlow)"/>
      <circle cx="-4" cy="-35" r="2" fill="#00ffff" opacity="0.95"/>
      <circle cx="-4" cy="-35" r="0.8" fill="#0a0a19"/>
      <circle cx="-4.5" cy="-35.5" r="0.4" fill="#00ffff" opacity="0.9"/>

      <!-- Eye scan line -->
      <line x1="-7" y1="-35" x2="-1" y2="-35" stroke="#00ffff" stroke-width="0.5" opacity="0.6">
        <animate attributeName="y1" values="-37;-33;-37" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-37;-33;-37" dur="2s" repeatCount="indefinite"/>
      </line>

      <!-- Head crest/crown -->
      <path d="M 0 -48 L -3 -45 L 0 -43 L 3 -45 Z"
            fill="url(#hawkCyan)" opacity="0.8"/>
    </g>

    <!-- NECK -->
    <ellipse cx="0" cy="-22" rx="9" ry="8" fill="url(#hawkGreen)" opacity="0.9"/>

    <!-- BODY - Powerful hawk body -->
    <ellipse cx="0" cy="0" rx="18" ry="25" fill="url(#hawkGreen)" opacity="0.95"/>

    <!-- Chest detail -->
    <ellipse cx="0" cy="-5" rx="14" ry="18" fill="url(#hawkGreen)" opacity="0.5"/>

    <!-- Circuit pattern on body -->
    <g opacity="0.6" stroke="#00ffff" stroke-width="1" fill="none">
      <line x1="0" y1="-15" x2="0" y2="20"/>
      <circle cx="0" cy="-8" r="3"/>
      <circle cx="0" cy="2" r="4"/>
      <circle cx="0" cy="12" r="2.5"/>
    </g>

    <!-- WINGS - Wide spread hawk wings -->
    <g>
      <!-- Left Wing -->
      <g transform="translate(-18, -5)">
        <!-- Main wing -->
        <ellipse cx="-15" cy="8" rx="22" ry="12" fill="url(#hawkCyan)" opacity="0.9"
                 transform="rotate(-35 -15 8)" stroke="#00ffaa" stroke-width="1"/>
        <!-- Wing feathers -->
        <path d="M -30 5 Q -38 8 -40 12 M -32 10 Q -38 12 -40 16 M -30 15 Q -35 16 -38 20"
              stroke="url(#hawkCyan)" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
        <!-- Circuit on wing -->
        <line x1="-10" y1="8" x2="-30" y2="10" stroke="#00ffff" stroke-width="0.8" opacity="0.5"/>
        <circle cx="-20" cy="8" r="2" fill="#00ffff" opacity="0.6"/>
      </g>

      <!-- Right Wing -->
      <g transform="translate(18, -5)">
        <!-- Main wing -->
        <ellipse cx="15" cy="8" rx="22" ry="12" fill="url(#hawkCyan)" opacity="0.9"
                 transform="rotate(35 15 8)" stroke="#00ffaa" stroke-width="1"/>
        <!-- Wing feathers -->
        <path d="M 30 5 Q 38 8 40 12 M 32 10 Q 38 12 40 16 M 30 15 Q 35 16 38 20"
              stroke="url(#hawkCyan)" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
        <!-- Circuit on wing -->
        <line x1="10" y1="8" x2="30" y2="10" stroke="#00ffff" stroke-width="0.8" opacity="0.5"/>
        <circle cx="20" cy="8" r="2" fill="#00ffff" opacity="0.6"/>
      </g>
    </g>

    <!-- TAIL - Long hawk tail feathers -->
    <g transform="translate(0, 25)">
      <!-- Main tail -->
      <path d="M -8 0 L -6 20 L -4 28 L 0 32 L 4 28 L 6 20 L 8 0 Z"
            fill="url(#hawkCyan)" opacity="0.9" stroke="#00ffaa" stroke-width="1"/>

      <!-- Tail feathers detail -->
      <line x1="-4" y1="5" x2="-5" y2="25" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="5" x2="0" y2="30" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
      <line x1="4" y1="5" x2="5" y2="25" stroke="#00ffff" stroke-width="1" opacity="0.5"/>

      <!-- Tail circuit -->
      <circle cx="0" cy="15" r="2" fill="none" stroke="#00ffff" stroke-width="0.8" opacity="0.5"/>
    </g>

    <!-- TALONS/LEGS - Hawk claws -->
    <g transform="translate(0, 20)">
      <!-- Left leg -->
      <line x1="-6" y1="0" x2="-8" y2="6" stroke="url(#hawkGreen)" stroke-width="2" opacity="0.9"/>
      <path d="M -8 6 L -10 9 M -8 6 L -8 9 M -8 6 L -6 9"
            stroke="#00ffaa" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>

      <!-- Right leg -->
      <line x1="6" y1="0" x2="8" y2="6" stroke="url(#hawkGreen)" stroke-width="2" opacity="0.9"/>
      <path d="M 8 6 L 10 9 M 8 6 L 8 9 M 8 6 L 6 9"
            stroke="#00ffaa" stroke-width="1.5" opacity="0.8" stroke-linecap="round"/>
    </g>

  </g>

  <!-- H4WK Text -->
  <text x="64" y="15"
        font-family="'Courier New', monospace"
        font-size="11"
        font-weight="bold"
        fill="url(#hawkGreen)"
        text-anchor="middle"
        filter="url(#glow)"
        letter-spacing="2">H4WK</text>

  <!-- HUD Corners -->
  <g stroke="#00ffaa" stroke-width="2" fill="none" opacity="0.7" filter="url(#glow)">
    <path d="M 8 22 L 8 8 L 22 8"/>
    <path d="M 106 8 L 120 8 L 120 22"/>
    <path d="M 8 106 L 8 120 L 22 120"/>
    <path d="M 120 106 L 120 120 L 106 120"/>
  </g>

  <!-- Corner nodes -->
  <g fill="#00ffff" opacity="0.8">
    <circle cx="8" cy="8" r="2" filter="url(#glow)"/>
    <circle cx="120" cy="8" r="2" filter="url(#glow)"/>
    <circle cx="8" cy="120" r="2" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="2" filter="url(#glow)"/>
  </g>

  <!-- Scan line -->
  <line x1="0" y1="64" x2="128" y2="64" stroke="#00ffaa" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
