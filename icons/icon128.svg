<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f001e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffaa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ccff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#aa00ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#6600ff;stop-opacity:0.5" />
    </linearGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ccff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:0.3" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with depth -->
  <circle cx="64" cy="64" r="63" fill="url(#spaceGradient)" opacity="0.95"/>
  <circle cx="64" cy="64" r="62" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#purpleGlow)" stroke-width="1" opacity="0.4"/>

  <!-- Star field -->
  <g opacity="0.9">
    <circle cx="20" cy="20" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="108" cy="25" r="1.5" fill="#00ffaa">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="95" r="1" fill="#00ffff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="100" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="60" r="0.8" fill="#00ff00">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="70" r="1" fill="#00ffff" opacity="0.7"/>
    <circle cx="115" cy="85" r="1.3" fill="#00ffaa" opacity="0.6"/>
    <circle cx="50" cy="15" r="0.9" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- HAWK - Main Design -->
  <g filter="url(#glow)">
    <!-- Hawk Head - Sharp and Angular -->
    <path d="M 64 28 L 58 32 L 54 38 L 52 44 L 52 50 L 54 54 L 58 56 L 64 58 L 70 56 L 74 54 L 76 50 L 76 44 L 74 38 L 70 32 Z"
          fill="url(#neonGreen)" opacity="0.9" stroke="#00ffaa" stroke-width="0.5"/>

    <!-- Hawk Beak - Sharp and Menacing -->
    <path d="M 64 28 L 60 26 L 58 28 L 60 30 L 64 32 Z"
          fill="#00ffff" opacity="0.95" stroke="#00ccff" stroke-width="0.5"/>

    <!-- Hawk Eye - Glowing and Intense -->
    <circle cx="59" cy="40" r="4" fill="url(#eyeGlow)" filter="url(#strongGlow)"/>
    <circle cx="59" cy="40" r="2.5" fill="#00ffff" opacity="0.9"/>
    <circle cx="59" cy="40" r="1.2" fill="#0a0a19"/>
    <circle cx="58.5" cy="39.5" r="0.5" fill="#00ffff" opacity="0.8"/>

    <!-- Digital scan line on eye -->
    <line x1="55" y1="40" x2="63" y2="40" stroke="#00ffff" stroke-width="0.5" opacity="0.6">
      <animate attributeName="y1" values="37;43;37" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="37;43;37" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- Head crest/crown (tech style) -->
    <path d="M 64 28 L 66 24 L 68 28 M 64 28 L 62 25 L 60 28"
          stroke="url(#neonCyan)" stroke-width="1.5" fill="none" opacity="0.8"/>

    <!-- Neck -->
    <path d="M 58 56 L 56 62 L 58 68 L 64 70 L 70 68 L 72 62 L 70 56"
          fill="url(#neonGreen)" opacity="0.85" stroke="#00ffaa" stroke-width="0.5"/>

    <!-- Body - Powerful and Angular -->
    <path d="M 58 68 L 54 76 L 52 84 L 54 92 L 58 98 L 64 102 L 70 98 L 74 92 L 76 84 L 74 76 L 70 68 Z"
          fill="url(#neonGreen)" opacity="0.9" stroke="#00ffaa" stroke-width="0.8"/>

    <!-- Circuit pattern on body -->
    <g opacity="0.7" stroke="#00ffff" stroke-width="1.2" fill="none">
      <line x1="64" y1="70" x2="64" y2="100"/>
      <circle cx="64" cy="75" r="2.5"/>
      <circle cx="64" cy="85" r="3"/>
      <circle cx="64" cy="95" r="2"/>
      <line x1="58" y1="80" x2="70" y2="80"/>
      <line x1="60" y1="90" x2="68" y2="90"/>
    </g>

    <!-- Wings - Geometric and Powerful -->
    <!-- Left Wing -->
    <g opacity="0.9">
      <path d="M 54 76 L 40 70 L 28 68 L 20 70 L 15 75 L 18 80 L 25 83 L 35 85 L 48 86 L 54 84"
            fill="url(#neonCyan)" stroke="#00ffaa" stroke-width="1.2"/>
      <!-- Wing circuit lines -->
      <line x1="54" y1="76" x2="25" y2="75" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
      <line x1="48" y1="86" x2="30" y2="82" stroke="#00ffff" stroke-width="0.8" opacity="0.5"/>
      <circle cx="35" cy="76" r="2" fill="#00ffff" opacity="0.7"/>
      <circle cx="25" cy="80" r="1.5" fill="#00ffaa" opacity="0.8"/>
      <!-- Wing feathers (digital) -->
      <path d="M 20 70 L 16 68 L 15 72 M 18 75 L 14 76 L 15 80"
            stroke="#00ffaa" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>

    <!-- Right Wing -->
    <g opacity="0.9">
      <path d="M 74 76 L 88 70 L 100 68 L 108 70 L 113 75 L 110 80 L 103 83 L 93 85 L 80 86 L 74 84"
            fill="url(#neonCyan)" stroke="#00ffaa" stroke-width="1.2"/>
      <!-- Wing circuit lines -->
      <line x1="74" y1="76" x2="103" y2="75" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
      <line x1="80" y1="86" x2="98" y2="82" stroke="#00ffff" stroke-width="0.8" opacity="0.5"/>
      <circle cx="93" cy="76" r="2" fill="#00ffff" opacity="0.7"/>
      <circle cx="103" cy="80" r="1.5" fill="#00ffaa" opacity="0.8"/>
      <!-- Wing feathers (digital) -->
      <path d="M 108 70 L 112 68 L 113 72 M 110 75 L 114 76 L 113 80"
            stroke="#00ffaa" stroke-width="1.5" fill="none" opacity="0.7"/>
    </g>

    <!-- Tail Feathers - Sharp and Tech -->
    <g opacity="0.85">
      <path d="M 64 102 L 60 110 L 58 118 L 60 122 L 64 124 L 68 122 L 70 118 L 68 110 Z"
            fill="url(#neonCyan)" stroke="#00ffaa" stroke-width="1"/>
      <path d="M 64 102 L 56 114 L 54 120 L 56 124"
            fill="none" stroke="url(#neonGreen)" stroke-width="1.5" opacity="0.7"/>
      <path d="M 64 102 L 72 114 L 74 120 L 72 124"
            fill="none" stroke="url(#neonGreen)" stroke-width="1.5" opacity="0.7"/>
      <!-- Tail circuit -->
      <line x1="64" y1="102" x2="64" y2="122" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
      <circle cx="64" cy="112" r="1.5" fill="#00ffff" opacity="0.8"/>
    </g>

    <!-- Talons/Claws -->
    <g opacity="0.75" stroke="#00ffaa" stroke-width="1.5" fill="none">
      <path d="M 58 98 L 56 102 L 54 106"/>
      <path d="M 64 100 L 64 106"/>
      <path d="M 70 98 L 72 102 L 74 106"/>
    </g>
  </g>

  <!-- H4WK Text with enhanced styling -->
  <text x="64" y="14"
        font-family="'Courier New', monospace"
        font-size="10"
        font-weight="bold"
        fill="url(#neonGreen)"
        text-anchor="middle"
        filter="url(#glow)"
        letter-spacing="1">H4WK</text>

  <!-- HUD Corner Brackets -->
  <g stroke="url(#neonCyan)" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)">
    <!-- Top Left -->
    <path d="M 8 24 L 8 8 L 24 8"/>
    <line x1="8" y1="8" x2="10" y2="8" stroke="#00ffff" stroke-width="3"/>

    <!-- Top Right -->
    <path d="M 104 8 L 120 8 L 120 24"/>
    <line x1="118" y1="8" x2="120" y2="8" stroke="#00ffff" stroke-width="3"/>

    <!-- Bottom Left -->
    <path d="M 8 104 L 8 120 L 24 120"/>
    <line x1="8" y1="118" x2="8" y2="120" stroke="#00ffff" stroke-width="3"/>

    <!-- Bottom Right -->
    <path d="M 120 104 L 120 120 L 104 120"/>
    <line x1="120" y1="118" x2="120" y2="120" stroke="#00ffff" stroke-width="3"/>
  </g>

  <!-- Corner circuit nodes -->
  <g fill="#00ffaa" opacity="0.8">
    <circle cx="8" cy="8" r="2" filter="url(#glow)"/>
    <circle cx="120" cy="8" r="2" filter="url(#glow)"/>
    <circle cx="8" cy="120" r="2" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="2" filter="url(#glow)"/>
  </g>

  <!-- Scanning line animation (optional) -->
  <line x1="0" y1="64" x2="128" y2="64" stroke="#00ffaa" stroke-width="1" opacity="0.3">
    <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
