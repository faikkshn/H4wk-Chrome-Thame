<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a35;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hawkG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="hawkC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="eye" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:0.4" />
    </radialGradient>

    <filter id="g">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="24" cy="24" r="23" fill="url(#bg)"/>
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#hawkC)" stroke-width="1.5" filter="url(#g)"/>

  <!-- Stars -->
  <circle cx="8" cy="8" r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="10" r="1" fill="#00ffaa" opacity="0.7"/>
  <circle cx="38" cy="38" r="0.7" fill="#00ffff" opacity="0.8"/>

  <!-- HAWK -->
  <g transform="translate(24, 24)" filter="url(#g)">

    <!-- Head -->
    <ellipse cx="0" cy="-13" rx="4.5" ry="5" fill="url(#hawkG)" opacity="0.95"/>

    <!-- Beak -->
    <path d="M -1 -11.5 Q -3 -10.5 -3.5 -10 Q -3 -10.5 -1.5 -11 Z"
          fill="#00ffff" opacity="0.95"/>

    <!-- Eye -->
    <circle cx="-1.5" cy="-13" r="1.5" fill="url(#eye)"/>
    <circle cx="-1.5" cy="-13" r="0.7" fill="#00ffff" opacity="0.95"/>
    <circle cx="-1.5" cy="-13" r="0.3" fill="#0a0a19"/>

    <!-- Neck -->
    <ellipse cx="0" cy="-8" rx="3.5" ry="3" fill="url(#hawkG)" opacity="0.9"/>

    <!-- Body -->
    <ellipse cx="0" cy="0" rx="7" ry="9" fill="url(#hawkG)" opacity="0.95"/>

    <!-- Circuit on body -->
    <line x1="0" y1="-6" x2="0" y2="7" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
    <circle cx="0" cy="-2" r="1.5" fill="none" stroke="#00ffff" stroke-width="0.6" opacity="0.6"/>
    <circle cx="0" cy="3" r="1" fill="none" stroke="#00ffff" stroke-width="0.6" opacity="0.6"/>

    <!-- Left Wing -->
    <ellipse cx="-8" cy="0" rx="8" ry="5" fill="url(#hawkC)" opacity="0.9"
             transform="rotate(-30 -8 0)" stroke="#00ffaa" stroke-width="0.8"/>
    <path d="M -12 -2 Q -14 0 -15 2 M -13 1 Q -15 2 -16 4"
          stroke="url(#hawkC)" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="-12" y2="1" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
    <circle cx="-8" cy="0" r="1" fill="#00ffff" opacity="0.6"/>

    <!-- Right Wing -->
    <ellipse cx="8" cy="0" rx="8" ry="5" fill="url(#hawkC)" opacity="0.9"
             transform="rotate(30 8 0)" stroke="#00ffaa" stroke-width="0.8"/>
    <path d="M 12 -2 Q 14 0 15 2 M 13 1 Q 15 2 16 4"
          stroke="url(#hawkC)" stroke-width="1.2" fill="none" opacity="0.8" stroke-linecap="round"/>
    <line x1="5" y1="0" x2="12" y2="1" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
    <circle cx="8" cy="0" r="1" fill="#00ffff" opacity="0.6"/>

    <!-- Tail -->
    <path d="M -3 9 L -2 13 L -1.5 16 L 0 17 L 1.5 16 L 2 13 L 3 9 Z"
          fill="url(#hawkC)" opacity="0.9" stroke="#00ffaa" stroke-width="0.6"/>
    <line x1="-1" y1="10" x2="-1.5" y2="15" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
    <line x1="0" y1="10" x2="0" y2="16" stroke="#00ffff" stroke-width="0.5" opacity="0.6"/>
    <line x1="1" y1="10" x2="1.5" y2="15" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>

    <!-- Legs/Talons -->
    <line x1="-2.5" y1="7" x2="-3" y2="10" stroke="url(#hawkG)" stroke-width="1" opacity="0.9"/>
    <path d="M -3 10 L -4 11.5 M -3 10 L -3 11.5 M -3 10 L -2 11.5"
          stroke="#00ffaa" stroke-width="0.8" opacity="0.8" stroke-linecap="round"/>

    <line x1="2.5" y1="7" x2="3" y2="10" stroke="url(#hawkG)" stroke-width="1" opacity="0.9"/>
    <path d="M 3 10 L 4 11.5 M 3 10 L 3 11.5 M 3 10 L 2 11.5"
          stroke="#00ffaa" stroke-width="0.8" opacity="0.8" stroke-linecap="round"/>
  </g>

  <!-- HUD Corners -->
  <g stroke="#00ffaa" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#g)">
    <path d="M 3 8 L 3 3 L 8 3"/>
    <path d="M 40 3 L 45 3 L 45 8"/>
    <path d="M 3 40 L 3 45 L 8 45"/>
    <path d="M 45 40 L 45 45 L 40 45"/>
  </g>

  <!-- Corner dots -->
  <g fill="#00ffff" opacity="0.8">
    <circle cx="3" cy="3" r="1"/>
    <circle cx="45" cy="3" r="1"/>
    <circle cx="3" cy="45" r="1"/>
    <circle cx="45" cy="45" r="1"/>
  </g>
</svg>
