<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a19;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a35;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="neonGrn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="neonCyn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="eyeGlw" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:0.3" />
    </radialGradient>

    <filter id="glw">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="24" cy="24" r="23" fill="url(#spaceGrad)"/>
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#neonCyn)" stroke-width="1.5" filter="url(#glw)"/>

  <!-- Stars -->
  <circle cx="8" cy="8" r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="40" cy="10" r="1" fill="#00ffaa" opacity="0.7"/>
  <circle cx="38" cy="38" r="0.7" fill="#00ffff" opacity="0.8"/>
  <circle cx="10" cy="38" r="0.9" fill="#ffffff" opacity="0.6"/>

  <!-- HAWK -->
  <g filter="url(#glw)">
    <!-- Head -->
    <path d="M 24 11 L 21 13 L 20 16 L 20 19 L 21 21 L 24 22 L 27 21 L 28 19 L 28 16 L 27 13 Z"
          fill="url(#neonGrn)" opacity="0.9" stroke="#00ffaa" stroke-width="0.5"/>

    <!-- Beak -->
    <path d="M 24 11 L 22 10 L 23 12 Z" fill="#00ffff" opacity="0.9"/>

    <!-- Eye -->
    <circle cx="22.5" cy="15" r="1.8" fill="url(#eyeGlw)"/>
    <circle cx="22.5" cy="15" r="1" fill="#00ffff" opacity="0.9"/>
    <circle cx="22.5" cy="15" r="0.4" fill="#0a0a19"/>

    <!-- Body -->
    <path d="M 21 21 L 20 26 L 20 32 L 22 36 L 24 38 L 26 36 L 28 32 L 28 26 L 27 21 Z"
          fill="url(#neonGrn)" opacity="0.9" stroke="#00ffaa" stroke-width="0.5"/>

    <!-- Circuit on body -->
    <line x1="24" y1="22" x2="24" y2="36" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
    <circle cx="24" cy="27" r="1.5" fill="none" stroke="#00ffff" stroke-width="0.6" opacity="0.6"/>
    <circle cx="24" cy="32" r="1" fill="none" stroke="#00ffff" stroke-width="0.6" opacity="0.6"/>

    <!-- Wings -->
    <!-- Left -->
    <path d="M 20 26 L 12 24 L 6 26 L 8 30 L 14 32 L 20 31"
          fill="url(#neonCyn)" opacity="0.85" stroke="#00ffaa" stroke-width="0.8"/>
    <line x1="20" y1="26" x2="10" y2="28" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
    <circle cx="12" cy="28" r="1" fill="#00ffff" opacity="0.7"/>

    <!-- Right -->
    <path d="M 28 26 L 36 24 L 42 26 L 40 30 L 34 32 L 28 31"
          fill="url(#neonCyn)" opacity="0.85" stroke="#00ffaa" stroke-width="0.8"/>
    <line x1="28" y1="26" x2="38" y2="28" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
    <circle cx="36" cy="28" r="1" fill="#00ffff" opacity="0.7"/>

    <!-- Tail -->
    <path d="M 24 38 L 22 42 L 22 45 L 24 46 L 26 45 L 26 42 Z"
          fill="url(#neonCyn)" opacity="0.85" stroke="#00ffaa" stroke-width="0.6"/>
    <line x1="24" y1="38" x2="24" y2="45" stroke="#00ffff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- HUD Corners -->
  <g stroke="#00ffaa" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#glw)">
    <path d="M 3 10 L 3 3 L 10 3"/>
    <path d="M 38 3 L 45 3 L 45 10"/>
    <path d="M 3 38 L 3 45 L 10 45"/>
    <path d="M 45 38 L 45 45 L 38 45"/>
  </g>

  <!-- Corner dots -->
  <g fill="#00ffff" opacity="0.8">
    <circle cx="3" cy="3" r="1"/>
    <circle cx="45" cy="3" r="1"/>
    <circle cx="3" cy="45" r="1"/>
    <circle cx="45" cy="45" r="1"/>
  </g>
</svg>
